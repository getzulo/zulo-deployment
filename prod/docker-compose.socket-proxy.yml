# Docker socket proxy — deploy on zo-app-1, ONLY when the control plane exists.
#
#   docker compose -f docker-compose.yml -f docker-compose.socket-proxy.yml up -d
#
# The control plane has to create, start and stop tenant containers, which means
# talking to Docker on this VM. It must NOT be given the raw daemon: the Docker
# API has no authentication, and anything that can reach it is root here — it can
# mount the host filesystem into a container and walk out with everything.
#
# This proxy sits in front of the socket and answers only the API groups enabled
# below, refusing the rest with 403. Anticipated by ControlPlane.Deployment.md §12.
#
# The whitelist is coarse by design (one flag per API group, plus a single POST
# switch), so treat the values below as a starting point and tighten them against
# what the control plane actually calls — `docker logs` on this container shows
# every refused request, which is the fastest way to find out.
#
# MEASURED against this configuration on 2026-09-08, because the flag names do not
# say what they cover:
#
#   POST /containers/{id}/exec   201  — ALLOWED. `EXEC: 0` does not cover exec
#                                       CREATION; that falls under CONTAINERS+POST.
#   POST /exec/{id}/start        403  — refused, which is what makes the above
#                                       inert: the object cannot be run, so there
#                                       is no shell into a tenant.
#   POST /containers/prune       200  — ALLOWED, and it deletes stopped containers,
#                                       i.e. suspended tenants. Recoverable — the
#                                       database survives and the registry can
#                                       rebuild the container — but it presents as
#                                       a tenant that vanished.
#   GET  /volumes                403  — refused. Tenant data-protection key rings
#                                       live in volumes.
#   GET  /secrets                403  — refused.
#   GET  /images, /networks, /info  200 — allowed, needed for provisioning.
#
# The residual risk is prune. Closing it needs a filter finer than one flag per
# group; until then, whatever can reach 2375 can remove stopped containers.
#
# NOT MEASURED, and deliberately kept out of the list above: the control plane's
# image sweep (PruneJobHandler.SweepImagesAsync) needs DELETE /images/{id} to
# pass. It is EXPECTED to, because the DELETE verb already reaches the daemon —
# tenant deletion calls RemoveContainerAsync, i.e. DELETE /containers/{id}, and
# that is a working feature — and IMAGES is 1. Nobody has confirmed it against
# this proxy. If it turns out to be refused, the sweep says so in its own words:
# TenantContainerService.RemoveImageAsync logs a 403 at Error naming this
# whitelist, separately from the 409 it gets for an image still in use.
name: zuloone-prod

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # --- needed for provisioning ---
      CONTAINERS: 1        # create, inspect, start, stop, remove, logs
      IMAGES: 1            # pull the tenant image
      NETWORKS: 1          # attach the container to the edge network
      POST: 1              # without this everything is read-only
      VERSION: 1           # Docker.DotNet negotiates on connect
      INFO: 1
      # --- deliberately refused ---
      EXEC: 0              # would allow arbitrary commands inside any tenant
      VOLUMES: 0           # tenant data-protection key rings live in volumes
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0            # includes prune, which would delete other people's work
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
      TASKS: 0
    volumes:
      # Read-only mount is not a security boundary on its own — the proxy is.
      # It only stops the proxy itself from rewriting the socket file.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Bound to this VM's LAN address, not 0.0.0.0: reachable from zo-cp-1
      # through the router rule, and from nowhere else. There is no NAT for 2375,
      # so it is not exposed to the internet.
      - "10.10.1.220:2375:2375"
    networks:
      # ITS OWN network, deliberately NOT `edge`.
      #
      # On the edge network this container sits on the same bridge as every
      # tenant, and container-egress.sh returns same-bridge traffic unconditionally
      # (`-i zo-edge0 -o zo-edge0 -j RETURN`) because Traefik has to reach the
      # tenants. A tenant could therefore open the Docker API on this container's
      # bridge address directly — past the host-input chain, past the router rule,
      # past every control that exists — and the Docker API has no authentication,
      # so that is root on the host that runs every customer's database.
      #
      # The control plane reaches it on 10.10.1.220:2375, the published host port.
      # It has no reason to share a network with anything.
      - socket

networks:
  socket:
    driver: bridge

