# getzulo.com — the public marketing and documentation site.
#
#   docker compose -f docker-compose.yml -f docker-compose.site.yml up -d site
#
# A separate file so the site can be deployed, restarted and rolled back without
# touching the tenant stack, and so an operator who does not run the site simply
# never passes this file.
#
# WHY IT IS HERE AT ALL. INSTALL.md §7.0 used to send this to Cloudflare Pages,
# and the reason it no longer does is the demo flow: from Pages, a static site
# cannot reach the control plane, so a demo request needed a Cloudflare Worker
# relaying it with a shared secret across the internet. On the fleet that becomes
# a call inside the network and the entire bridge disappears.
#
# The cost, stated plainly: the site is down whenever zo-app-1 is down. That is
# tolerable because during such an incident the demos are down too (they are
# containers on this host) and so are the customer tenants — a live marketing
# page promising reliable hosting would be lying at exactly that moment.
#
# PREREQUISITES, both easy to forget and both silent until they are not:
#   1. A Cloudflare Origin certificate for getzulo.com / *.getzulo.com, placed on
#      zo-app-1 as /opt/zuloone/certs/getzulo.pem + getzulo.key. That directory is
#      NOT in this repository and never will be — .gitignore drops certs/ and
#      *.key, because the Origin CA private key is shown once at issuance and is a
#      full origin-impersonation credential. See traefik/dynamic/tls.yml.
#      Without it Cloudflare answers 526 for the site alone.
#   2. getzulo.com added as a site in Cloudflare, proxied, with an A record for
#      @ and www.
#   3. An Origin Rule on that zone rewriting the destination port to 8443. The
#      router dst-nats 8443 -> 10.10.1.220:443 and has NO rule for inbound 443,
#      so without this Cloudflare times out and the site answers 522 while every
#      zulo.one host keeps working. Nothing on the MikroTik changes; its rule is
#      per-port, not per-hostname.

services:
  site:
    image: ${SITE_IMAGE:?set SITE_IMAGE, e.g. 10.10.0.210:5000/getzulo-site:2026.9.0}
    restart: unless-stopped

    # No environment, no volumes, no secrets. The image is pre-built HTML and an
    # nginx config; there is nothing here for a compromise to read. That is the
    # whole reason this is acceptable on a host that also runs tenant containers.

    labels:
      traefik.enable: "true"
      traefik.docker.network: zuloone-prod_edge
      # Both names on one router: Cloudflare is told to proxy www, and a visitor
      # who types it must not meet a certificate error on the way to the
      # redirect.
      traefik.http.routers.site.rule: Host(`getzulo.com`) || Host(`www.getzulo.com`)
      traefik.http.routers.site.entrypoints: websecure
      # Unlike the tenants, this one does NOT ride the default certificate — the
      # wildcard is for *.zulo.one. Traefik selects the getzulo pair by SNI from
      # the file provider's certificate list.
      traefik.http.routers.site.tls: "true"
      traefik.http.services.site.loadbalancer.server.port: "8080"
      # www → apex, permanently. Done at the edge rather than in nginx so the
      # site image stays domain-agnostic and can be run locally as-is.
      traefik.http.routers.site.middlewares: site-www@docker
      traefik.http.middlewares.site-www.redirectregex.regex: ^https://www\.getzulo\.com/(.*)
      traefik.http.middlewares.site-www.redirectregex.replacement: https://getzulo.com/$${1}
      traefik.http.middlewares.site-www.redirectregex.permanent: "true"

    networks:
      # Edge only. The site has no reason to reach the data bridge, and not
      # attaching it is cheaper than remembering not to use it.
      - edge

    healthcheck:
      # Served by the nginx config itself, so this answers even when every page
      # is missing — which is the case worth detecting after a bad build.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The customer cabinet. A SECOND application on the same hostname — a Next.js
  # multi-zone — not a route inside the site.
  #
  # Why the split is physical rather than a router rule: the `site` service above
  # says "no environment, no volumes, no secrets", and that property is the whole
  # argument for putting a public site on a host that also runs tenant
  # containers. The cabinet holds a customer's control-plane bearer and
  # per-tenant credentials in its process, so it cannot have that property. Two
  # containers means a flaw in the brochure cannot read a token.
  #
  # Why the paths are split HERE and not in the site's nginx: the same reason the
  # www redirect above is a Traefik middleware — the site image stays
  # domain-agnostic and runnable as-is, and the static container never needs to
  # know the cabinet's address or be up for the cabinet to answer.
  cabinet:
    image: ${CABINET_IMAGE:?set CABINET_IMAGE, e.g. 10.10.0.210:5000/getzulo-cabinet:2026.9.0}
    restart: unless-stopped

    # Secrets land here in D4/D5 (the control-plane base URL and the service
    # credential it presents). Until then the zone answers without any, which is
    # why it can be deployed and smoke-tested before the portal is switched on.
    environment:
      # Reached over the internal network — the LAN address on zo-cp-1, port
      # 8443 (see docker-compose.controlplane.yml), NOT the internet-facing
      # Cloudflare hostname. `/api/portal/**` is NOT published to the internet,
      # and that is the point: nothing at the edge routes to it, so no
      # Cloudflare Access bypass is needed on the panel's hostname.
      #
      # The value is an in-SAN name (cp.zulo.one), not the bare IP: the Origin
      # CA leaf on zo-cp-1 carries SAN *.zulo.one, and Node's TLS validation
      # fails a bare-IP connection on hostname mismatch. `extra_hosts` below
      # points that name at the internal address instead of Cloudflare's edge,
      # and the image trusts the Origin CA root via NODE_EXTRA_CA_CERTS (see
      # Dockerfile) so the leaf itself validates.
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?set CONTROL_PLANE_URL, e.g. https://cp.zulo.one:8443}
      # 32 bytes, base64. Seals the session cookie; the process refuses to start
      # without it, deliberately — a default would be identical everywhere and
      # would let anyone with the source mint a session for any address.
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      CABINET_SESSION_KEY: ${CABINET_SESSION_KEY:?set CABINET_SESSION_KEY in zo-app-1's own .env, NOT cp.env — different host}
      # The browser is sent to LOGIN_ISSUER. The code is exchanged on the edge
      # network (LOGIN_INTERNAL_URL), so the cabinet does not need public egress
      # to login.getzulo.com. The secret is the cabinet client's secret from
      # login.env, stored on this host as LOGIN_CLIENT_SECRET.
      LOGIN_ISSUER: https://login.getzulo.com
      LOGIN_INTERNAL_URL: http://login:8080
      LOGIN_CLIENT_ID: cabinet
      LOGIN_CLIENT_SECRET: ${LOGIN_CLIENT_SECRET:?set LOGIN_CLIENT_SECRET in zo-app-1 .env}
      LOGIN_REDIRECT_URI: https://getzulo.com/api/cabinet/callback
      PUBLIC_ORIGIN: https://getzulo.com
      # Same value as Portal__CabinetKey on the control plane. Lets a directory
      # sign-in open the stands granted to that address.
      CABINET_PORTAL_KEY: ${CABINET_PORTAL_KEY:?set CABINET_PORTAL_KEY in zo-app-1 .env, the same value as Portal__CabinetKey}

    extra_hosts:
      # cp.zulo.one is a real public record, proxied by Cloudflare — resolving
      # it normally would send this container's traffic out to the internet and
      # back in, which container-egress.sh's default-deny would then also have
      # to be opened for. This override keeps the name (for TLS SAN matching)
      # but sends the packets straight to the internal address instead.
      - "cp.zulo.one:10.10.0.200"

    labels:
      traefik.enable: "true"
      traefik.docker.network: zuloone-prod_edge
      # Three shapes of path belong to this zone and nothing else does:
      #   /api/cabinet/**        route handlers (sessions, OAuth callbacks)
      #   /cabinet-static/**     its assets — `assetPrefix` exists so these do
      #                          NOT collide with the site's own /_next/**
      #   /<locale>/cabinet/**   the pages themselves
      # The locale list is closed on purpose: a bare regexp of `/*/cabinet` would
      # hand this zone any first segment somebody invents.
      traefik.http.routers.cabinet.rule: >-
        Host(`getzulo.com`) && (PathPrefix(`/api/cabinet`) ||
        PathPrefix(`/cabinet-static`) ||
        PathRegexp(`^/(en|ru|ar|uk)/cabinet`))
      # Traefik derives priority from rule length, which already puts this ahead
      # of the site's Host-only rule. Stated anyway: the day somebody lengthens
      # the site rule, the cabinet must not silently lose.
      traefik.http.routers.cabinet.priority: "100"
      traefik.http.routers.cabinet.entrypoints: websecure
      traefik.http.routers.cabinet.tls: "true"
      traefik.http.services.cabinet.loadbalancer.server.port: "8080"
      traefik.http.routers.cabinet.middlewares: cabinet-noindex@docker
      # A customer portal's sign-in page in search results is an invitation to
      # credential stuffing. The app sets this too; the edge repeats it so a
      # future page that forgets the metadata is still covered.
      traefik.http.middlewares.cabinet-noindex.headers.customresponseheaders.X-Robots-Tag: "noindex, nofollow"
      # Deliberately NO blanket `Cache-Control: no-store` here: it would also hit
      # /cabinet-static/_next/**, whose files are fingerprinted and meant to be
      # cached hard. The app sets no-store on the responses that need it.

    networks:
      # Edge only, and permanently — not a staging step. The control plane is
      # not a container on this host's data bridge; it is a different VM
      # (zo-cp-1) reached over the LAN. Container egress leaves via zo-edge0,
      # NATed behind this host's own address, same as any tenant's Postgres
      # traffic — see container-egress.sh's CP_HOST/CP_PORT rule, which is what
      # actually permits the connection through the default-deny.
      - edge

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/cabinet/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
    name: zuloone-prod_edge
