# Production topology: Cloudflare (proxied) → MikroTik → Traefik → tenant,
# with a replicated Postgres on the data subnet. See ARCHITECTURE.md.
#
# This is a STANDALONE file, not an overlay on ../phase-0/docker-compose.yml.
# Compose can override a service but cannot delete one, and production drops two
# things phase-0 defines: the bundled `postgres` service and the internal `data`
# network. Overlaying would leave both running.
#
#   docker compose --env-file .env up -d
#
# Differences from phase-0 worth knowing:
#   * No ACME anywhere. The origin certificate is a static 15-year Cloudflare
#     Origin CA cert, supplied through the file provider (traefik/dynamic/tls.yml).
#   * No `data` network. The database is off-box, reached over the internet, so
#     the tenant needs ordinary outbound — which the `edge` bridge already gives.
#   * Cloudflare's SSL/TLS mode MUST be "Full (Strict)". On "Flexible" Cloudflare
#     talks plain HTTP to the origin, Traefik bounces it to HTTPS, the client
#     comes back through Cloudflare on :80 again — an infinite redirect loop.
name: zuloone-prod

services:
  # ------------------------------------------------------------- ingress ---
  traefik:
    # PINNED, and the floor matters. Traefik up to at least v3.3 asks the Docker
    # daemon for API version 1.24; Docker 29 REMOVED everything below 1.40, so the
    # provider gets
    #
    #   client version 1.24 is too old. Minimum supported API version is 1.40
    #
    # and never reads a single container label. The failure is quiet in the way
    # that costs the most time: both containers run, the tenant's healthcheck is
    # green, :443 accepts TCP — there is simply no router to match, so every
    # request dies right after the connection is established. Only Traefik's log
    # names the cause, and DOCKER_API_VERSION does not help because that Traefik
    # sets the version in code and ignores the environment. v3.7 negotiates,
    # which was verified here by running it with no such variable at all.
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      # Tenant routers still come from container labels...
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=zuloone-prod_edge
      # ...while the file provider supplies the TLS store. Both run together;
      # this is the only reason the file provider is enabled in production.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      # Without `insecure` nothing listens on :8080 and the loopback mapping
      # below is dead. It is unauthenticated, which is why it is bound to
      # 127.0.0.1 and reached only over an SSH tunnel — never publish it.
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      # Loopback only. Reach it with `ssh -L 8090:127.0.0.1:8090 <host>`.
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      # Read-only: Traefik only WATCHES container labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - edge

  # -------------------------------------------------------------- tenant ---
  tenant-t1:
    image: ${ZULOONE_IMAGE:?set ZULOONE_IMAGE, e.g. 10.10.0.210:5000/zuloone-core:2026.9.0}
    restart: unless-stopped
    environment:
      Database__Provider: PostgreSql
      # PG_HOSTS lists BOTH cluster nodes, comma-separated. Npgsql 6+ probes
      # pg_is_in_recovery() and hands out connections only from the primary
      # (`Target Session Attributes=Primary`), rechecking every 10 s — so after a
      # Patroni failover this string finds the new leader with no VIP, no
      # HAProxy, and no ESXi vSwitch changes. See ARCHITECTURE.md §4.
      #
      # Npgsql does NOT retry a failed command on the other host: statements in
      # flight during a failover throw, and this container restarts. That is the
      # expected behaviour, not a misconfiguration.
      #
      # PG_SSL_MODE: check with `psql -c "SHOW ssl;"` on the primary.
      # Require — server has ssl=on. Disable — it does not. Never `Prefer`:
      # it falls back to plaintext silently, so you never learn which you got.
      ConnectionStrings__DefaultConnection: >-
        Host=${PG_HOSTS:?set PG_HOSTS};Port=${PG_PORT:-5432};Database=${T1_DB_NAME:?set T1_DB_NAME};Username=${T1_DB_USER:?set T1_DB_USER};Password=${T1_DB_PASSWORD:?set T1_DB_PASSWORD};SSL Mode=${PG_SSL_MODE:-Require};Trust Server Certificate=true;Target Session Attributes=Primary
      # Per-tenant key: a token minted for one tenant is meaningless to another.
      Jwt__SigningKey: ${T1_JWT_KEY:?set T1_JWT_KEY}
      # TLS terminates at Traefik, so Core sees plain HTTP. Without this its
      # HTTPS redirect bounces back through the proxy forever.
      ZuloOne__BehindReverseProxy: "true"
      # Behind Cloudflare, X-Forwarded-For does NOT hold the client. Traefik does
      # not trust inbound X-Forwarded-* by default, so it discards Cloudflare's
      # value and substitutes its own TCP peer — which, with the entry point on
      # the core router, is that router's transit address for every request from
      # everywhere. Measured on this stand: `X-Forwarded-For: 10.255.0.1`, one
      # entry, no chain.
      #
      # The only place that surfaces is MetaSessions, which records the address
      # of every login — the field an administrator reads to notice a login from
      # somewhere it should not be coming from. Identical for all of them, and
      # nothing else looks wrong.
      #
      # CF-Connecting-IP is a single address, always the real client, and
      # Cloudflare overwrites whatever the caller sent. Trustworthy only because
      # the origin is unreachable except through Cloudflare — which is what the
      # router's source restriction buys, and why removing it breaks more than
      # it appears to.
      ZuloOne__ForwardedForHeader: CF-Connecting-IP
      #
      # Workspace__Path is DELIBERATELY ABSENT and must stay that way.
      # WorkspaceSyncService is registered unconditionally and also reads the
      # path from MetaSystemSettings['Workspace.Path'] in the database, which is
      # NOT behind the dev gate. If it ever resolves a path in production, a
      # watcher exports the whole metadata surface to disk, DELETES orphan files
      # there, and imports anything edited in that folder back into the live
      # database. Verify the DB row is absent after any restore from a dev dump.
      #
      # ZuloOne__CoreDevelopmentMode is likewise absent: it defaults to false,
      # which is what installs the global RequireAuthenticatedUser fallback.
      # Setting it true makes the ENTIRE API anonymous.
    labels:
      traefik.enable: "true"
      traefik.docker.network: zuloone-prod_edge
      traefik.http.routers.t1.rule: Host(`${T1_HOST:?set T1_HOST, e.g. t1.zulo.one}`)
      traefik.http.routers.t1.entrypoints: websecure
      # No certresolver: the default certificate from the file provider's TLS
      # store serves every tenant, because the Origin CA cert is a wildcard.
      traefik.http.routers.t1.tls: "true"
      traefik.http.services.t1.loadbalancer.server.port: "8080"
    volumes:
      # Data-protection key ring. Without a volume every restart mints a new
      # ring and every stored assistant API key becomes unreadable.
      - dp-keys-t1:/var/zuloone/dp-keys
    networks:
      - edge
      # Same private bridge as mongo — hostname `mongo`, not the LAN address.
      - data

  # ----------------------------------------------------------- farm journal ---
  # One mongod for the whole installation; the control plane creates a database
  # and read/write user per tenant (`logs_<slug>`). Tenants reach it over the
  # `data` bridge; zo-cp-1 reaches the published port on this host (see INSTALL).
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-zuloone}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      # Control plane on zo-cp-1 is off-box — it uses the LAN address, not the
      # docker hostname. Tenant containers use `mongo` on the data network.
      - "27017:27017"
    networks:
      edge:
      data:
        # PINNED — next free address after edge (.0/24) and LAN pg/app (.210/.220).
        # Must match MONGO_NODES in container-egress.sh.
        ipv4_address: 172.30.1.2

volumes:
  dp-keys-t1:
  mongo-data:

networks:
  edge:
    # Both of these are PINNED so the container-egress firewall can reference
    # them. Compose otherwise names the bridge br-<network-id> and picks a random
    # 172.17-31 subnet, and a rule pointing at either would silently stop
    # matching after a `down`/`up` — turning the lockdown into a no-op with no
    # visible symptom. Change these here and in container-egress.sh together.
    driver_opts:
      com.docker.network.bridge.name: zo-edge0
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    # Private bridge for tenant ↔ mongo, same role phase-0 gives Postgres. Not
    # attached to Traefik. PINNED for the same reason as edge above.
    driver_opts:
      com.docker.network.bridge.name: zo-data0
    ipam:
      config:
        - subnet: 172.30.1.0/24
