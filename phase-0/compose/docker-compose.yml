# Phase 0: one tenant + Traefik + Postgres (manual setup)
# Domain: *.zulo.one → requires wildcard DNS A record pointing to this VPS
# TLS: Let's Encrypt DNS-01 via Traefik (requires DNS provider API creds in .env)

services:
  # Traefik ingress + TLS termination
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    environment:
      - TZ=UTC
    networks:
      - tenant-net

  # Postgres cluster (one DB per tenant)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tenant-net

  # Tenant: t1 (test tenant on t1.zulo.one)
  tenant-t1:
    image: zuloone/core:latest  # Built from zulo.one
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=tenant_t1;Username=t1;Password=t1pwd
      Database__Provider: PostgreSql
      Jwt__SigningKey: ${JWT_KEY_T1}
      ASPNETCORE_URLS: http://+:5000
    labels:
      traefik.enable: "true"
      traefik.http.routers.t1.rule: Host(`t1.zulo.one`)
      traefik.http.routers.t1.entrypoints: websecure
      traefik.http.routers.t1.tls.certresolver: le
      traefik.http.services.t1.loadbalancer.server.port: "5000"
    networks:
      - tenant-net
    depends_on:
      - postgres

volumes:
  postgres-data:

networks:
  tenant-net:
    driver: bridge
