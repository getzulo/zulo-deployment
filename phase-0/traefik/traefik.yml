# Traefik config: Docker provider + Let's Encrypt wildcard TLS

global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  insecure: true  # :8080 dashboard (not exposed; only for internal)

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
  file:
    filename: /traefik.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      email: admin@zulo.one
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare  # or other DNS provider
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  level: INFO
accessLog: {}
